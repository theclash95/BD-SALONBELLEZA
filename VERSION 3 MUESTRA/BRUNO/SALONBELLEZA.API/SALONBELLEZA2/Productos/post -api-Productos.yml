info:
  name: post /api/Productos
  type: http
  seq: 2
  tags:
    - Productos

http:
  method: POST
  url: https://localhost:7180/api/Productos
  body:
    type: json
    data: |-
      {
        "idCategoriaProducto": 1,
        "codigo": "SH-001",
        "nombre": "Shampoo Keratina",
        "descripcion": "Shampoo de 500ml",
        "precioCosto": 2500,
        "precioVenta": 4500,
        "stock": 20,
        "stockMinimo": 5
      }
  auth: inherit

settings:
